screencast.caption.create.welcome=Ласкаво просимо! Цей скрінкаст проведе вас через основи роботи з Cinecred.
screencast.caption.create.new=Ми щойно запустили Cinecred і нас привітало це вікно. Давайте створимо новий проєкт.
screencast.caption.create.drop=Найпростіший спосіб перетягнути порожню папку у вікно.
screencast.caption.create.config=Тепер ми можемо підлаштувати шаблон проєкту. Окрім {0}, доступні й інші формати для нашої електронної таблиці титрів.
screencast.caption.create.exec=Давайте створимо проєкт.
screencast.caption.create.done=Папка проєкту була створена з шаблону.
screencast.caption.video.look=Давайте подивимось титри в дії за допомогою вбудованого відео плеєру попереднього перегляду.
screencast.caption.video.play=Ви можете натискати кнопку відтворення або клавішу {0} багато разів, щоб збільшити швидкість відтворення.
screencast.caption.delivery.look=Давайте зазирнемо до цінних можливостей експорту в Cinecred.
screencast.caption.delivery.formats=Стоп-кадри, PDF-файли, контейнерні формати та послідовності зображень, всі вони підтримуються.
screencast.caption.delivery.transparent=Деякі формати навіть дозволяють прозорий фон для ручного компонування.
screencast.caption.pages.explore=Давайте розглянемо, як збираються титри у Cinecred.
screencast.caption.pages.composed=Послідовність титрів складається зі сторінок.
screencast.caption.pages.each=Кожна сторінка є або титульною карткою, або прокручуваним розділом (який може містити картки).
screencast.caption.pages.flick=Ви можете використовувати вкладки, щоб перегортати сторінки.
screencast.caption.files.look=Давайте відкриємо файловий браузер і подивимось на папку проєкту.
screencast.caption.files.list1={0} файл - це електронна таблиця з нашими титрами. Тека {1} містить зразок зображення.
screencast.caption.files.list2=Ви не редагуєте файл {0} вручну, а працюєте з ним безпосередньо через Cinecred.
screencast.caption.files.credits=Давайте відкриємо файл електронної таблиці.
screencast.caption.files.hide=Та швидко приховаємо панель дизайну.
screencast.caption.files.snap=Ми рекомендуємо прикріпити редактор електронних таблиць до правої сторони екрана.
screencast.caption.files.switch=Тепер одним натисканням кнопки ви можете перемикатися між редагуванням титрів і їх дизайном.
screencast.caption.files.edit=Давайте змінимо ім’я режисера.
screencast.caption.files.reload=Після збереження файлу, зміни були автоматично виявлені, і титри були перемальовані.
screencast.caption.files.mistake=Давайте навмисно додамо помилку: від’ємний вертикальний інтервал.
screencast.caption.files.warning=Подивіться, як Cinecred попереджає нас про помилку та вказує її місцезнаходження.
screencast.caption.assign.columns=В електронній таблиці два стовпчики відповідають за призначення стилів для титрів.
screencast.caption.assign.page=Призначення стилю сторінки завжди розпочинає нову сторінку.
screencast.caption.assign.pages=Зверніть увагу, перші два призначення відображаються як картки, коли третє відображається як довгий список з прокруткою.
screencast.caption.assign.content=На відміну від цього, стиль змісту розповсюджується на всі «блоки» до моменту призначення іншого стилю змісту.
screencast.caption.assign.block=Блок - це список клітинок тіла (напр. імена знімальної групи) з опціональною головою та хвостом (напр. назва посади).
screencast.caption.assign.assist=Наприклад, в цьому блоці, {0} та {1} є клітинками тіла, а клітинкою голови є {2}.
screencast.caption.assign.guides1=У вікні попереднього перегляду, клітинки тіла позначені в помаранчевий колір, а клітинки голови і хвоста в зелений.
screencast.caption.assign.guides2=Ці підказки шарів часто є дуже корисними, але за потреби ви можете вимкнути їх.
screencast.caption.assign.change=Давайте призначимо інші стилі змісту та подивимось, що з цього вийде.
screencast.caption.assign.heads=Стиль {0} фактично не підтримується головою, тому Cinecred попереджає нас про відкинуті голови.
screencast.caption.vGap.lines1=Дивіться як ці 3 пусті рядки роблять великий вертикальний інтервал у вікні перегляду.
screencast.caption.vGap.lines2=В порівняні, цей 1 пустий рядок робить маленький вертикальний інтервал зі значенням 1/3 від висоти.
screencast.caption.vGap.explicit=Ви також можете вручну вказати вертикальні інтервали, наприклад, еквівалент з 8.5 пустих рядків.
screencast.caption.styling.open=Давайте повернемо назад панель дизайну.
screencast.caption.styling.vGap=Тут, ви можете вказати розмір вертикального інтервалу для кожного пустого рядка. Ми радимо використовувати висоту вашого основного шрифту.
screencast.caption.styling.global=Ці проєктні налаштування також налаштовують для фільму ширину, довжину та кількість кадрів.
screencast.caption.styling.runtime=І ви можете вказати бажану тривалість, яку потім Cinecred спробує досягти, за допомогою підштовхування вертикальних інтервалів.
screencast.caption.styling.reset=Якщо потрібно, ви можете скасувати одиничні дії або повністю повернутись до останнього збереженого дизайну на диску.
screencast.caption.styling.styles=На цій панелі, ви також визначаєте стилі які ми бачили в електронній таблиці.
screencast.caption.styling.addRemove=Новий проєкт створюється з набором стилів, але ви можете додати більше, або вилучити будь-який стиль.
screencast.caption.styling.page=Стилі сторінки як оця, в основному визначають таймінги та швидкість прокрутки.
screencast.caption.gutter.open=Давайте тепер подивимось на стиль змісту та на його найбільш важливі налаштування.
screencast.caption.gutter.orient=Голова і хвіст може знаходитись, або горизонтально поруч із тілом, або вертикально над ним та під ним.
screencast.caption.gutter.spine1=Блакитна лінія в перегляді є хребтом, до якої прикріплені всі блоки.
screencast.caption.gutter.spine2=В електронній таблиці, ви можете зміщувати хребет та навіть виконувати декілька хребтів в паралелі.
screencast.caption.gutter.letterRef=Шрифт тіла визначений по зовнішньому стилю літер, до якого ми тут посилаємось.
screencast.caption.gutter.layout=Елементи тіла можуть, або бути покладені в решітку, рухатись як клітинки, або рухатись як текст. Ми використаємо тут решітку.
screencast.caption.gutter.harmonize=В можете гармонізувати розміри, такі як ширина стовпчиків решітки через блоки.
screencast.caption.gutter.justify=Це потім дозволяє вирівняти всі тіла, вправо, як приклад.
screencast.caption.gutter.columns=Авжеж, решітка теж може мати декілька стовпчиків.
screencast.caption.gutter.head=Голова і хвіст мають варіанти схожі на ті, що ми бачили. Обидва можуть бути увімкненими окремо.
screencast.caption.bullets.open=Далі, давайте подивимось на стиль змісту з шаром {0}.
screencast.caption.bullets.justify=Ви можете вирівнювати рядки в різних напрямках.
screencast.caption.bullets.harmonize=Як і раніше, ви можете гармонізувати такі розміри як, ширина клітинки, або в межах кожного блоку, або між блоками.
screencast.caption.bullets.sep=Розділювач клітинки, також може бути змінений або пропущений.
screencast.caption.blurb.open=Щоб закінчити це, давайте подивимось на стиль змісту з шаром {0}.
screencast.caption.blurb.justify=Цей шар від природи має менше налаштувань. Тим не менш, ви можете змінювати вирівнювання.
screencast.caption.letter.open=Давайте тепер подивимось на наступну категорію: Стилі Літер.
screencast.caption.letter.lots=Стилі літер пропонують багато різних варіантів, але ми звернемо увагу на найбільш важливі.
screencast.caption.letter.fonts=Cinecred поставляється з різною різноманітністю шрифтів, але також пропонує й ті, що є в папці проєкту та в системі.
screencast.caption.letter.height=Трохи не традиційно, розмір шрифту задається як висота в пікселях, а не як зазвичай, в розмірах точки.
screencast.caption.letter.caps=Для літер верхнього регістру, використовуйте наступний перемикач, замість того щоб вводити текст з верхнім регістром в електронну таблицю.
screencast.caption.letter.except=Стандартно, налаштовуваний список таких частинок як {0} є вільним.
screencast.caption.letter.sc=Підтримуються обидва, маленькі та малесенькі великі літери.
screencast.caption.letter.underline=Ви можете додати такі шари як підкреслення.
screencast.caption.letter.layers=Шари малюються знизу доверху. Потягайте їх навколо щоб змінити їх порядок.
screencast.caption.letter.advanced=Система шару завдяки широким розширеним опціям дозволяє створювати насичені дизайни.
screencast.caption.picture.insert=Нарешті, давайте подивимось як вставити зображення, яке має назву {0} з проєктної папки.
screencast.caption.picture.cell=Ми відкриємо електронну таблицю і вставимо тег зображення в клітинку тіла.
screencast.caption.picture.config=Зображення вмить з'явилося в титрах. Ви можете налаштувати його на панелі дизайну.
screencast.caption.picture.videos=Аналогічно, ви можете вставляти відео та послідовність зображень, написавши {0}.
screencast.caption.outro.congrats=Вітаємо! Тепер ви знайомі з основами Cinecred.
screencast.caption.outro.guide=Щоб навчитись більшого, зверніться до посібника користувача на веб-сторінці Cinecred.
screencast.caption.outro.try=Або просто запустіть проєкт та пограйтесь самі навколо.
screencast.caption.outro.fun=Розважайтесь!
