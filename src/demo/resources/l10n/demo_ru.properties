screencast.caption.create.welcome=Приветствуем! Этот видеоурок проведёт по основам Cinecred.
screencast.caption.create.new=Мы только что запустили Cinecred, и перед нами появилось это окно. Давайте создадим новый проект.
screencast.caption.create.drop=Самый простой способ — перетащить пустую папку в окно.
screencast.caption.create.config=Мы теперь можем изменить шаблон проекта. Помимо XLSX, для нашей таблицы кредитов доступны другие форматы.
screencast.caption.create.exec=Давайте создадим проект.
screencast.caption.create.done=Папка проекта была создана с использованием шаблона.
screencast.caption.video.look=Давайте посмотрим, как работают титры, используя встроенный просмотр видео.
screencast.caption.video.play=Вы можете нажать кнопку воспроизведения или клавишу [{0}] несколько раз, чтобы сделать видео быстрее.
screencast.caption.delivery.look=Давайте взглянем на богатые возможности экспорта в Cinecred.
screencast.caption.delivery.formats=Стоп-кадры, PDF-файлы, файлы в контейнерах и последовательности картинок — всё это поддерживается.
screencast.caption.delivery.transparent=Некоторые форматы даже допускают прозрачный фон для ручной компоновки.
screencast.caption.pages.explore=Давайте рассмотрим, как создаются титры в Cinecred.
screencast.caption.pages.composed=Последовательность титров состоит из страниц.
screencast.caption.pages.each=Каждая страница представляет собой либо титульную карточку, либо прокручиваемый раздел (который может включать карточки).
screencast.caption.pages.flick=Вы можете использовать вкладки для переключения между страницами.
screencast.caption.files.look=Давайте откроем Проводник и посмотрим на папку проекта.
screencast.caption.files.list1=Файл XLSX — это таблица с нашими титрами. В папке Logos содержится пример изображения.
screencast.caption.files.list2=Вы не редактируете {0} вручную, а через Cinecred.
screencast.caption.files.credits=Давайте откроем файл таблицы.
screencast.caption.files.hide=И быстро скройте панель стилей.
screencast.caption.files.snap=Рекомендуем прижать редактор таблиц к правому краю экрана.
screencast.caption.files.switch=Теперь одним нажатием кнопки вы можете переключаться между редактированием титров и их стилизацией.
screencast.caption.files.edit=Давайте изменим имя режиссёра.
screencast.caption.files.reload=После сохранения файла изменение было автоматически обнаружено, и титры перерисованы.
screencast.caption.files.mistake=Давайте введём ошибку: отрицательный вертикальный отступ.
screencast.caption.files.warning=Посмотрите, как Cinecred предупреждает нас об ошибке и ее местоположении.
screencast.caption.assign.columns=В таблице две колонки назначают стили титрам.
screencast.caption.assign.page=Назначение стиля страницы всегда начинает новую страницу.
screencast.caption.assign.pages=Посмотрите, как первые два задания запускают карты, а третье — длинный свиток.
screencast.caption.assign.content=В отличие от этого, стиль содержимого влияет на все так называемые «блоки», пока не будет назначен другой стиль содержимого.
screencast.caption.assign.block=Блок — это список ячеек тела (например, имена членов команды) с необязательной головой/хвостом (например, должностью).
screencast.caption.assign.assist=К примеру, здесь {0} и {1} — ячейки тела, а голова — {2}.
screencast.caption.assign.guides1=На предпросмотре оранжевым выделены ячейки тела, зелёным — головы и хвосты.
screencast.caption.assign.guides2=Эти направляющие макета часто очень полезны, но их можно отключить при необходимости.
screencast.caption.assign.change=Давайте назначим разные стили содержимого и посмотрим, что получится.
screencast.caption.assign.heads=Стиль {0} на самом деле не поддерживает заголовок, поэтому Cinecred предупреждает нас о сброшенных заголовках.
screencast.caption.vGap.lines1=Посмотрите, как эти 3 пустые строки создают большой вертикальный зазор в предварительном просмотре.
screencast.caption.vGap.lines2=В сравнении с этим, 1 пустая строка создаёт меньший вертикальный зазор — всего 1/3 высоты.
screencast.caption.vGap.explicit=Также вы можете явно указать вертикальные отступы, например, эквивалент 8,5 пустых строк.
screencast.caption.styling.open=Давайте вернём панель стилей.
screencast.caption.styling.vGap=Здесь вы можете установить размер вертикального отступа, добавляемого одной пустой строкой. Рекомендуем использовать высоту основного шрифта.
screencast.caption.styling.global=Эти настройки проекта также определяют ширину, высоту и частоту кадров фильма.
screencast.caption.styling.runtime=Также вы можете установить целевое время воспроизведения, которое Cinecred постарается соблюсти, подстраивая вертикальные отступы.
screencast.caption.styling.reset=При необходимости вы можете отменить отдельные шаги или полностью вернуться к стилизации, последней сохранённой на диск.
screencast.caption.styling.styles=В этой панели вы также определяете стили, которые мы видели в таблице Титры.
screencast.caption.styling.addRemove=Новые проекты поставляются с набором стилей, но вы можете добавить другие или удалить любой стиль.
screencast.caption.styling.page=Стили страниц, подобные этому, в основном определяют тайминги и скорость прокрутки.
screencast.caption.gutter.open=Теперь давайте посмотрим на стиль содержимого и его ключевые настройки.
screencast.caption.gutter.orient=Головы и хвосты могут располагаться горизонтально рядом с телом или вертикально над/под ним.
screencast.caption.gutter.spine1=Голубая линия в превью — это корешок, к которому прикреплены все блоки.
screencast.caption.gutter.spine2=В таблице титров вы можете сместить корешок и даже запустить несколько корешков параллельно.
screencast.caption.gutter.letterRef=Шрифт тела определяется внешним стилем букв, на который мы здесь ссылаемся.
screencast.caption.gutter.layout=Элементы тела могут располагаться в сетке, течь как ячейки или течь как текст. Здесь мы используем сетку.
screencast.caption.gutter.harmonize=Вы можете выровнять размеры, например ширину колонок сетки между блоками.
screencast.caption.gutter.justify=Это позволяет, например, выравнивать все основные блоки по правому краю.
screencast.caption.gutter.columns=Сетка, конечно, может содержать несколько колонок.
screencast.caption.gutter.head=У заголовка и завершения есть похожие опции. Оба могут включаться отдельно.
screencast.caption.bullets.open=Теперь рассмотрим стиль контента с макетом {0}.
screencast.caption.bullets.justify=Строки можно выравнивать разными способами.
screencast.caption.bullets.harmonize=Как и раньше, можно гармонизировать размеры, например ширину ячейки, внутри каждого блока или для всех блоков.
screencast.caption.bullets.sep=Разделитель ячеек, конечно, можно изменить или убрать.
screencast.caption.blurb.open=Завершим обзор стилем контента с макетом {0}.
screencast.caption.blurb.justify=У этого макета меньше настроек, но можно изменить выравнивание.
screencast.caption.letter.open=Теперь перейдём к следующей категории: стили букв.
screencast.caption.letter.lots=Стили букв предлагают множество опций, но мы сосредоточимся на самых важных.
screencast.caption.letter.fonts=Cinecred поставляется с различными шрифтами, а также поддерживает шрифты из папки проекта и системные.
screencast.caption.letter.height=Необычно, но размер шрифта указывается в пикселях по высоте, а не в пунктах.
screencast.caption.letter.caps=Для заглавных букв используйте соответствующий переключатель, а не вводите заглавные буквы вручную в таблице.
screencast.caption.letter.except=По умолчанию из списка исключаются конфигурируемые частицы, такие как {0}.
screencast.caption.letter.sc=Поддерживаются как маленькие, так и уменьшенные капители (small и petite caps).
screencast.caption.letter.underline=Можно добавлять слои, например подчёркивание.
screencast.caption.letter.layers=Слои рисуются снизу вверх. Их можно перетаскивать, чтобы изменить порядок.
screencast.caption.letter.advanced=Система слоёв позволяет создавать сложные дизайны благодаря обширным расширенным опциям.
screencast.caption.picture.insert=Наконец, посмотрим, как вставить картинку, например {0} из папки проекта.
screencast.caption.picture.cell=Откроем таблицу и вставим тег картинки в ячейку основного блока.
screencast.caption.picture.config=Картинка сразу появилась в титрах. Её можно настроить в панели стилей.
screencast.caption.picture.videos=Аналогично можно вставлять видео и последовательности изображений, написав {0}.
screencast.caption.outro.congrats=Поздравляем! Теперь вы знакомы с основами Cinecred.
screencast.caption.outro.guide=Чтобы узнать больше, обратитесь к руководству пользователя на сайте Cinecred.
screencast.caption.outro.try=Или просто откройте проект и экспериментируйте самостоятельно.
screencast.caption.outro.fun=Удачи!
