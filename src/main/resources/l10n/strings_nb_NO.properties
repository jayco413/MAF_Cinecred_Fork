ui.hints.welcomeTrack.welcome=Velkommen til Cinecred! Hint som denne vil introdusere deg til det grunnleggende i programmet.\n\nAkkurat nå ser du på {0}-fanen. Deretter skal vi se på {1}-fanen til venstre.
ui.hints.welcomeTrack.project=Et Cinecred-prosjekt er ingenting mer enn en mappe med minst en kredittregnearkfil og en «Styling.toml» fil. Prosjektet kan i tillegg inneholde skrifttyper, bilder, videoer og bildesekvenser.
ui.hints.welcomeTrack.create=Trykk her for å initialisere et nytt prosjekt i en tom mappe.
ui.hints.welcomeTrack.open=Trykk her for å åpne en eksisterende prosjektmappe.
ui.hints.welcomeTrack.drop=Alternativt kan du også dra og slippe en tom eller eksisterende prosjektmappe inn i dette vinduet (eller i appstarteren) for å initialisere eller åpne den.
ui.hints.projectTrack.pageTabs=Du har åpnet en prosjektmappe! La oss begynne med det grunnleggende.\n\nI Cinecred består rulletekstene av sider. Hver side er enten et tittelkort eller en seksjon av rulletekst som kan inkludere tittelkort. Bruk fanene ovenfor for å bla gjennom sidene.
ui.hints.projectTrack.creditsLog=I prosjektmappa er det en regnearkfil. Åpne det nå i et passende program. I denne filen gir du råkredittdataene og velger hvilke stiler som skal benyttes på hvilke deler. Eventuelle problemer med filen vil vises i denne listen.
ui.hints.projectTrack.toggleStyling=Denne knappen viser og skjuler stylingpanelet til høyre. Tips: Fest programmet du redigerer regnearket med til samme sted. Du kan så bytte mellom regnearket og stylingpanelet med denne knappen.
ui.hints.projectTrack.stylingTree=I dette stylingpanelet redigerer du «Styling»-filen fra prosjektmappa. Bortsett fra noen prosjektinnstillinger, definerer du navngitte stiler her, som du så refererer fra regnearket.\n\n<b>Sidestiler</p> bestemmer oppførselen til sider; for eksempel kan du sette rullehastigheten i en sidestil. I regnearket gis alle sidene en sidestil.\n\n<b>Innholdsstiler</b> bestemmer hvordan såkalte hode-innhold-hale-blokker ser ut; en slik blokk kan for eksempel bestå av jobbtittelet «Ekstraer» sammen med en gruppe navn. I regnearket gis hver blokk en innholdsstil som så bestemmer oppsettet og bokstavstilene.\n\n<b>Bokstavstiler</b> bestemmer hvordan en tekst ser ut. En bokstavstil setter skrifttypen og en rekke andre egenskaper som farger og bokstavenes mellomrom. Bokstavstiler blir hovedsakelig referert fra innholdsstiler. Imidlertidig kan de også refereres rett fra regnearket gjennom {0}-taggen for å bruke flere forskjellige bokstavstiler i samme tekstbolk.\n\n<b>Overgangsstiler</b> spesifiserer ramper som toner kort og videoer inn og ut, og endrer jevnt rullehastigheten mellom smeltede kort og rullesider.\n\n<b>Bilder</b> og <b>videoer</b> vises her for konfigurering når du refererer dem i regnearket gjennom {1} eller {2}-taggene. I motsetning kan du også manuelt lage disse her før du refererer til dem i regnearket.
ui.hints.projectTrack.resetStyling=For å forstå alle stilvalgene, er det hjelpsomt å leke deg litt rundt med dem. Du trenger ikke være redd for å ødelegge noe! Du kan alltid trykke på denne knappen for å tilbakestille stilen til den sist lagrede på disken.
ui.hints.projectTrack.guides=Denne knappen viser og skjuler veldig nyttige oppsettsguider. De hjelper deg ikke bare å lære Cinecred, men er også nødvendige for å jobbe effektivt selv når du vet hvordan alt fungerer. Tips: Holder du musepekeren over denne knappen vises betydningen til hver oppsettsguidefarge.
ui.hints.projectTrack.video=Når du vil se dine rulletekster i aksjon, trykker du denne knappen for å vise forhåndsvisningspanelet.
ui.hints.projectTrack.delivery=Når du er klar til å eksportere, trykker du på denne knappen for å åpne leveransepanelet.
ui.hints.projectTrack.finished=Gratulerer! Du kan nå det grunnleggende om Cinecred. Nå anbefaler vi at du sjekker ut den omfattende brukerguiden på {0}, at du leker deg rundt med de forskjellige stylinginnstillingene og tar en dypere titt på regnearkets struktur. Vi ønsker deg en hyggelig opplevelse med Cinecred!
