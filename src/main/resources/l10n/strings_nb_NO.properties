teaser=Hvis du noen gang har laget rulletekster til en film, vet du at de kan være krevende å sette sammen og et slit å få helt riktige. Å justere oppsett, skriftstørrelser eller mellomrom i etterkant er ekstremt tidkrevende. Og ikke engang tenk på å treffe en nøyaktig spilletid samtidig som du unngår flimmerfella.\n\nMen det finnes en bedre måte: Cinecred, et fritt og åpent program for å lage rulletekster uten slit. Cinecred leser kredittdataene dine fra et Excel-, LibreOffice- eller Google-regneark og lar deg interaktivt arrangere og utforme rulletekstene akkurat slik du ønsker. Det følger med en standardmal som får deg raskt i gang, men alt kan egendefineres ned til den enkelte piksel. Bruk dine egne fonter eller sett inn logoer, bilder - til og med videoer. Når du er ferdig, kan du forhåndsvise rulleteksten i den integrerte avspilleren før du eksporterer den til et bredt utvalg av video- og bildeformater.
