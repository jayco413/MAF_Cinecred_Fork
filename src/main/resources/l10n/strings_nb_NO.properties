projectIO.credits.table.spinePosDesc=For kort: Starter en ny rygg ved denne horisontale og eventuelt vertikale forskyvningen fra skjermens midtpunkt i piksler. Ved å legge til {0} eller {1} plasseres den nye ryggen under eller over posisjonen i stedet for å midtstille den. Eksempler: {2}\n\nFor ruller: Starter en ny rygg under den forrige ved denne horisontalforskyvningen fra skjermens midtpunkt i piksler. Eksempel: {3}\n\nFor begge: Du kan også skrive inn en horisontalforskyvning fra skjermens midtpunkt etterfulgt av {4} for å plassere den nye ryggen ved siden av den forrige. Eller du kan bruke {5}, som forklares via en advarsel når du skriver det. Eksempler på dette: {6}
