projectIO.credits.table.pageRuntimeDesc=Ønsket spilletid for den nye siden som en tidskode. Flere rullesider kan justeres sammen ved å legge til et gruppenavn til den første sidens tidskode og bruke dette gruppenavnet som spilletid for de andre sidene. Eksempler for SMPTE: {0}
