projectIO.credits.table.contentStyleDesc=Starter en ny blokk med hovedinnhold og hale med denne stilen. Den nye stilen brukes også på alle følgende blokker.
projectIO.credits.table.vGapDesc=Vertikalt mellomrom mellom blokkene med hovedinnhold og hale over og under (i konfigurerte prosjektomfattende enheter, eller i piksler når du legger til {0}).
projectIO.credits.table.tailDesc=Tekst under eller til høyre for hovedinnholdet.\n\n{0} fungerer som i {1}.
projectIO.credits.table.bodyDesc=Tekst, bilder eller videoer mellom det siste hodet og halen. Avhengig av innholdsstilen er hver tabellrad en ny rutenettcelle, flytende celle eller paragraf.\n\n{0} fungerer som i {1}.\n\nBruk {2} for en tom celle.\n\nBruk {3} for å sette inn et bilde eller {4} for å sette inn en video- eller bildesekvens fra prosjektmappen. Disse kan deretter konfigureres i stilpanelet. Du kan utelate filtypen, eller legge til en kvalifikator for å konfigurere flere opptredener av samme fil separat. Eksempler: {5}
projectIO.credits.table.headDesc=Tekst over eller til venstre for hovedinnholdet.\n\nBruk {0} for å endre bokstavstilen til {1} og bare {2} for å tilbakestille den. Eksempel: {3}
