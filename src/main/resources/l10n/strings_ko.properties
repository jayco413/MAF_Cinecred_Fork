ui.hints.projectTrack.stylingTree=이 스타일링 창에서 프로젝트 폴더의 "스타일링" 파일을 편집합니다. 일부 프로젝트 설정 외에도 여기에서 명명된 스타일을 정의한 다음 '크레딧' 파일에서 참조할 수 있습니다.\n\n<b>페이지 스타일</b>는 페이지의 동작을 제어합니다. 예를 들어 페이지 스타일에서 스크롤 속도를 설정할 수 있습니다. "크레딧" 파일에서 각 페이지에는 페이지 스타일이 할당됩니다.\n\n<b>콘텐츠 스타일</b>는 소위 머리-몸통-꼬리 블록의 모양을 결정합니다. 예를 들어 이러한 블록은 이름 그룹과 함께 "Extras"라는 직책으로 구성될 수 있습니다. "크레딧" 파일에서 각 블록에는 콘텐츠 스타일이 할당되어 레이아웃과 문자 스타일을 결정합니다.\n\n<b>문자 스타일</b>는 텍스트의 모양을 결정합니다. 문자 스타일은 글꼴과 색상 및 글자 간격과 같은 다양한 기타 속성을 설정합니다. 문자 스타일은 주로 콘텐츠 스타일에서 참조됩니다. 그러나 동일한 텍스트에 여러 가지 문자 스타일을 사용하기 위해 {0} 태그를 통해 "크레딧" 파일에서 직접 참조할 수도 있습니다.\n\n<b>전환 스타일</b>는 카드와 비디오를 페이드 인/아웃하고 녹화된 카드와 스크롤 페이지 사이의 스크롤 속도를 부드럽게 변경하는 램프를 지정합니다.\n\n<b>사진</b> 및 <b>동영상</b>는 {1} 또는 {2} 태그를 통해 "크레딧" 파일에서 참조할 때 여기에 구성할 수 있습니다. 반대로 '크레딧' 파일에서 참조하기 전에 여기에 수동으로 추가할 수도 있습니다.
teaser=영화의 엔딩 크레딧을 만들어 본 적이 있다면, 엔딩 크레딧이 조립하는 것이 힘들고 제대로 만드는 것이 고통스럽다는 것을 알고 있을 것입니다. 레이아웃, 글꼴 크기 또는 간격을 사후에 변경하는 것은 엄청나게 많은 시간이 소요됩니다. 그리고 쉬머 트랩을 돌면서 정확한 런타임 요건을 맞출 생각은 꿈도 꾸지 마세요.\n\n하지만 더 좋은 방법이 있습니다: 바로 무료 오픈 소스 프로그램인 시네크레드를 사용하면 수고 없이 크레딧을 만들 수 있습니다. Cinecred는 Excel, LibreOffice 또는 Google 스프레드시트에서 크레딧 데이터를 읽은 다음 원하는 방식으로 크레딧을 인터랙티브하게 정렬하고 스타일을 지정할 수 있습니다. 빠르게 시작할 수 있는 기본 템플릿이 제공되지만, 픽셀 단위까지 모든 것을 사용자 지정할 수 있습니다. 나만의 글꼴을 사용하거나 로고, 사진 또는 동영상을 삽입할 수도 있습니다. 완성된 후에는 통합 플레이어에서 스크롤을 확인한 후 다양한 동영상 및 이미지 시퀀스 형식으로 내보낼 수 있습니다.
projectIO.credits.table.spinePosDesc=카드의 경우: 화면 중앙에서 이 수평 및 선택적으로 수직 오프셋(픽셀 단위)에서 새 스파인을 시작합니다. {0} 또는 {1} 을 추가하면 새 스파인이 중앙에 위치하는 대신 아래 또는 위에 배치됩니다. 예시: {2}\n\n스크롤의 경우: 화면 중심에서 이 수평 오프셋(픽셀 단위)에서 이전 스파인 아래에 새 스파인을 시작합니다. 예시: {3}\n\n둘 다: 화면 중심에서 수평 오프셋을 입력한 다음 {4} 을 입력하여 새 스파인을 이전 스파인 옆에 배치할 수도 있습니다. 또는 입력 시 경고가 표시되는 {5} 을 사용합니다. 예시 {6}
projectIO.credits.table.bodyDesc=가장 최근의 머리글과 꼬리글 사이의 텍스트, 이미지 또는 동영상입니다. 콘텐츠 스타일에 따라 각 표 행은 새로운 그리드 셀, 흐름 셀 또는 단락이 됩니다.\n\n{0} {1} 에서와 같이 작동합니다.\n\n빈 셀에는 {2} 을 사용합니다.\n\n {3} 을 사용하여 사진을 삽입하거나 {4} 을 사용하여 프로젝트 폴더에서 비디오 또는 이미지 시퀀스를 삽입합니다. 그런 다음 스타일링 창에서 구성할 수 있습니다. 파일 확장자를 생략하거나 한정자를 추가하여 동일한 파일의 여러 모양을 개별적으로 구성할 수 있습니다. 예시: {5}
projectIO.credits.illFormattedSpinePosCard=프로젝트 폴더에는 "크레딧"파일이 있습니다. SifeLag 프로그램에서 지금 해당 파일을 엽니 다. "크레딧"파일에서 DAPERDIATION을 순서로 순환하고 PIE의 엉덩이에 적용 해야하는 스타일을 선언합니다. 해당 파일에 문제 가이 표에 가기를 원합니다.
ui.styling.global.uppercaseExceptions.desc=서양 문은 놓여지기가 장미를 선호 할 때 마찬가지로 똑같습니다. 주성자 붕괴 나 첫 번째 장소는 장직입니다.
ui.hints.projectTrack.resetStyling=모든 스타일링 옵션을 이해하려면, 그냥 약간의 게임을 즐기는 것이 도움이됩니다. 그러나 뭔가를 깨는 아라하드는하지 않습니다!이 버튼을 클릭하여 드라이버를 마지막으로 저장하거나 디스크에서로드 된 것으로 간주 할 수 있습니다.
projectIO.credits.illFormattedSpinePosHook=값이 {0}으로 시작하면 뒤로 펀치 뒤로 uppil 뒤에 꺼내어 튀김 척추 (BET 1 및 {1}), 함께 뒤로 뒤이어야하는 트윈 척추의 점 ({2}, {3}) 또는 선택적으로 이러한 점에서 사이클의 수평이며 수직 거리입니다. 예 : {5}
ui.hints.projectTrack.creditsLog=프로젝트 폴더에서 "크레딧"파일이 있습니다. 해당 파일을 "bititt"파일을 열면 RAW 크레딧 데이터를 알리고 누가 스타일을 해당해야할지 여부를 지정하십시오. 해당 파일의 문제는 주석에 표시됩니다.
ui.hints.projectTrack.guides=이 버튼 할인 및 호스트는 제품을 사용할 수 있습니다. 또한, 당신은 제품의 가격에 있으며, 각 레이아웃, 극장, 뒤에있는 방법을 필요로합니다.
projectIO.credits.illFormattedPageGap=값은 음의 노드 골드 {0} 타임 코드 (예 : {1} 또는 {2})도없고 키 카드 in 3}을 입력하여 in 3.}을 삽입 할 수 있습니다. 삭제 횟수와 + 3} + 3} + 3}의 경우, 듀얼 레이드 및 끈적 거리는 스티로 속도를 부드럽게 변경합니다 (예 : {4} 또는 {5}).
projectIO.credits.table.pageRuntimeDesc=새로운 페이지의 시간 탐색 시간을 끌어냅니다. 그룹 이름을 처음 페이지의 시간 코드로 예측하고 해당 그룹 이름을 다른 페이지의 런타임을 사용하여 여러 스크롤 페이지를 함께 조정할 수 있습니다. SMPTE : {0}
ui.hints.projectTrack.toggleStyling=이 버튼은 오른쪽에 스타일링 창을 돌리고 숨 깁니다. 팁 :이 제품의 "신용"파일과 동일한 휴가를 해제하십시오. 이번에는 "Credit"파일과이 버튼을 통해 스타일링 창을 보았을 수 있습니다.
ui.hints.welcomeTrack.project=CineRred에서 신뢰성, 프로젝트 크레딧 "탭"테이블 및 "styling.toml"파일에 대한 새로운 프로젝트가 될 수 있습니다. 중독을 추가하면 글꼴, 그림, 비디오 및 이미지 시퀀스가 포함될 수 있습니다.
ui.hints.welcomeTrack.welcome=CineRed에 오신 것을 환영합니다! 이와 같이 힌트는 프로그램의 기본 사항을 소개합니다. 현재 {0} 탭의 주제가 깊이 있습니다. 왼쪽에있는 다음 조.
projectIO.credits.table.pageGapDesc=긍정적이거나 낡은 {n "{to to in qually pages에 캡션을 삽입하고 옵션 전환 시간 지우기 및 스타일을 스크롤 속도를 원활하게 변경합니다. SMPTE : {1}의 예제
