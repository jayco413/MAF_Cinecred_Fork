projectIO.credits.pictureIllFormatted=Тег изображения должен содержать имя файла изображения из папки проекта, опционально с квалификатором для отдельной настройки нескольких вхождений одного и того же изображения. Примеры: {0}
projectIO.credits.videoIllFormatted=Тег видео должен содержать имя видеофайла (или папки с последовательностью изображений) из папки проекта, опционально с квалификатором для отдельной настройки нескольких вхождений одного и того же видео. Примеры: {0}
projectIO.credits.table.headDesc=Текст над или слева от основного содержимого.\n\nИспользуйте {0}, чтобы изменить стиль букв на {1}, и просто {2}, чтобы сбросить его. Пример: {3}
projectIO.credits.table.bodyDesc=Текст, изображения или видео между последними указанными началом и окончанием блока. В зависимости от стиля контента каждая строка таблицы становится новой ячейкой сетки, ячейкой потока или абзацем.\n\n{0} работает так же, как и в {1}.\n\nДля пустой ячейки используйте {2}.\n\nЧтобы вставить изображение из папки проекта, используйте {3}; чтобы вставить видео или последовательность изображений — {4}. После этого их можно настроить в панели стилей. Расширение файла можно не указывать. Также можно добавить вариант имени, чтобы по отдельности настроить несколько вариантов использования одного и того же файла. Примеры: {5}
projectIO.credits.table.tailDesc=Текст ниже или справа от основного содержимого.\n\n{0} работает так же, как и в {1}.
projectIO.credits.table.spinePosDesc=Для карточек: Начинает новую ось на указанном горизонтальном (и, при необходимости, вертикальном) смещении от центра экрана в пикселях. Добавление {0} или {1} размещает новую ось ниже или выше указанной позиции вместо центрирования. Примеры: {2}\n\nДля скроллов: Начинает новую ось под предыдущей на указанном горизонтальном смещении от центра экрана в пикселях. Пример: {3}\n\nДля обоих: Также можно ввести горизонтальное смещение от центра экрана, а затем {4}, чтобы разместить новую ось рядом с предыдущей. Или использовать {5}, что объясняется в предупреждении при вводе. Примеры: {6}
projectIO.credits.table.pageStyleDesc=Начинает новую страницу с этим стилем.
projectIO.credits.table.pageRuntimeDesc=Желаемое время выполнения новой страницы в формате таймкода. Несколько прокручиваемых страниц можно объединить в группу, добавив имя группы к таймкоду первой страницы и используя это имя группы как время выполнения для других страниц. Примеры для SMPTE: {0}
projectIO.credits.table.pageGapDesc=Временной промежуток между страницами в виде положительного или отрицательного таймкода, или {0} для вставки карточек на прокручиваемые страницы, плюс опциональный таймкод длительности перехода и стиль для плавного изменения скорости прокрутки. Примеры для SMPTE: {1}
