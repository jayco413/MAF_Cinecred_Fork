ui.hints.welcomeTrack.welcome=Вас приветствует Cinecred! Подсказки, подобные этой, познакомят вас с основами программы.\n\nСейчас вы находитесь на вкладке {0}. Далее мы рассмотрим вкладку {1} слева.
ui.hints.welcomeTrack.project=Файл проекта Cinecred — это просто папка, в которой есть хотя бы один файл таблицы титров и файл Styling.toml. Кроме того, он может содержать шрифты, изображения, видео и последовательности изображений.
ui.hints.welcomeTrack.create=Нажмите здесь, чтобы инициализировать новый проект в пустой папке.
ui.hints.welcomeTrack.open=Нажмите здесь, чтобы открыть существующую папку проекта.
ui.hints.welcomeTrack.drop=Также вы можете перетащить пустую или существующую папку проекта в это окно (или даже на значок запуска программы), чтобы инициализировать или открыть её.
ui.hints.projectTrack.pageTabs=Вы успешно открыли папку проекта! Теперь давайте начнём с основ.\n\nВ Cinecred титры состоят из страниц. Каждая страница может быть либо статичной заставкой (title card), либо секцией прокручиваемых титров, которая может включать в себя такие заставки. Используйте вкладки выше, чтобы пролистывать страницы.
ui.hints.projectTrack.creditsLog=В папке проекта находится файл таблицы титров. Откройте его в подходящей программе. В этом файле вы указываете исходные данные титров и задаёте, какие стили должны применяться к тем или иным частям. Все проблемы с файлом будут показаны в этом списке.
ui.hints.projectTrack.toggleStyling=Эта кнопка показывает и скрывает панель стилизации справа. Совет: разместите программу, в которой вы редактируете таблицу, в той же области экрана. Тогда с помощью этой кнопки можно будет переключаться между таблицей и панелью стилей.
ui.hints.projectTrack.stylingTree=В этой панели стилизации вы редактируете файл Styling из папки проекта. Помимо некоторых настроек проекта, здесь вы задаёте стили с названиями, на которые затем ссылаетесь из таблицы.\n\n<b>Стили страниц</b> управляют поведением страниц: например, в стиле страницы задаётся скорость прокрутки. В таблице каждой странице назначается стиль страницы.\n\n<b>Стили содержимого</b> определяют внешний вид блоков титров (так называемых блоков: «заголовок», «основная часть» и «окончание»)Прокрутить. Такие блоки могут, например, состоять из роли «Массовка» и списка имён рядом. В таблице каждому блоку назначается стиль содержимого; он задаёт раскладку блока и то, какие стили букв использовать.\n\n<b>Стили букв</b> определяют внешний вид текста. Стиль букв задаёт шрифт и различные другие свойства, такие как цвет и межбуквенный интервал. Стили букв в основном используются в стилях содержимого. Однако на них также можно ссылаться напрямую из таблицы с помощью тега {0}, чтобы использовать несколько разных стилей букв в одном текстовом блоке.\n\n<b>Стили переходов</b> задают кривые, по которым карточки и видео появляются и исчезают, а также плавное изменение скорости прокрутки между объединёнными карточками и страницами с прокруткой.\n\n<b>Изображения</b> и <b>видео</b> появляются здесь для настройки, когда вы ссылаетесь на них из таблицы с помощью тегов {1} или {2}. И наоборот: вы также можете вручную добавить их здесь, прежде чем ссылаться на них из таблицы.
ui.hints.projectTrack.resetStyling=Чтобы разобраться во всех возможностях стилизации, полезно немного поэкспериментировать с ними. Не бойтесь что-то сломать! Вы всегда можете нажать эту кнопку, чтобы вернуть стиль к последней сохранённой или загруженной с диска версии.
ui.hints.projectTrack.guides=Эта кнопка показывает и скрывает невероятно полезные направляющие макета. Они не только помогают в изучении Cinecred, но и необходимы для эффективной работы, даже когда вы хорошо разбираетесь в программе. Совет: при наведении на кнопку отображается значение каждого цвета направляющих макета.
ui.hints.projectTrack.video=Когда вы хотите увидеть, как выглядят ваши титры в действии, нажмите эту кнопку, чтобы открыть окно предварительного просмотра видео.
ui.hints.projectTrack.delivery=Когда будете готовы экспортировать проект, нажмите эту кнопку, чтобы открыть окно экспорта.
ui.hints.projectTrack.finished=Поздравляем! Теперь вы знакомы с основами Cinecred. Далее мы рекомендуем ознакомиться с подробным руководством пользователя на {0}, поэкспериментировать с различными настройками стиля и глубже изучить структуру файла «Титры». Желаем приятной работы с Cinecred!
