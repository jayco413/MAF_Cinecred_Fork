ui.hints.welcomeTrack.welcome=Ласкаво просимо до Cinecred! Такі підказки як ця, ознайомлять вас з основами програми.\n\nНаразі ви переглядаєте вкладку {0}. Далі ми розглянемо вкладку {1} ліворуч.
ui.hints.welcomeTrack.project=Проєкт Cinecred, це не що інше, як тека з щонайменше однією електронною таблицею та файлом «Styling.toml». На додаток, він може містити шрифти, зображення, відео та послідовності зображень.
ui.hints.welcomeTrack.create=Натисніть тут, щоб ініціалізувати новий проєкт у порожній папці.
ui.hints.welcomeTrack.open=Натисніть тут, щоб відкрити наявну папку проєкту.
ui.hints.welcomeTrack.drop=Як варіант, ви також можете перетягнути порожню або наявну папку проєкту в це вікно (або навіть на іконку запуску програми), щоб ініціалізувати та відкрити її.
ui.hints.projectTrack.pageTabs=Ви успішно відкрили папку проєкту! Давайте почнемо з основ.\n\nУ Cinecred, титри складаються зі сторінок. Кожна сторінка є або титульною карткою, або розділом з прокручуваними титрами, який може включати в себе титульні картки. Використовуйте вкладки у верхній частині для перемикання між сторінками.
ui.hints.projectTrack.creditsLog=У теці проєкту є файл з електронною таблицею. Відкрийте цей файл у відповідній програмі. У тому файлі, ви надаєте необроблені дані титрів, та вказуєте які стилі слід застосовувати та до яких частин. Будь-які проблеми з файлом будуть показані в цьому списку.
ui.hints.projectTrack.toggleStyling=Ця кнопка показує та приховує вікно дизайну праворуч. Порада: Розмістіть програму, за допомогою якої ви редагуєте електронну таблицю у те саме місце. Потім за допомогою цієї кнопки ви можете перемикатися між електронною таблицею та вікном дизайну.
ui.hints.projectTrack.stylingTree=На цій панелі дизайну ви редагуєте файл «Styling» з теки проєкту. Окрім деяких налаштувань проєкту, тут ви визначаєте названі стилі, на які потім посилаєтесь із електронної таблиці.\n\n<b>Стилі сторінок</b> регулюють поведінку сторінок; наприклад, ви встановлюєте швидкість прокручування в стилі сторінки. У електронній таблиці, кожній сторінці призначається стиль сторінки.\n\n<b>Стилі вмісту</b> визначають зовнішній вигляд так званих блоків «головка-тіло-хвіст»; такий блок може, наприклад, складатися з назви посади «Extras» разом із групою імен. У електронній таблиці кожному блоку призначається стиль вмісту, який потім визначає його шар і стилі літер.\n\n<b>Стилі літер</b> визначають зовнішній вигляд тексту. Стиль літери встановлює шрифт та різні інші властивості, як-от колір і інтервали між літерами. Стилі літер в основному посилаються із стилів вмісту. Однак, на них також можна посилатися безпосередньо з електронної таблиці за допомогою тегу {0}, для того щоб використовувати кілька різних стилів літер у одному фрагменті тексту.\n\n<b>Стилі переходу</b> визначають спади, які затухають картки та відео, на початку та вкінці, а також плавно змінюють швидкість прокручування між картками які розчинились та сторінками прокрутки.\n\n<b>Зображення</b> і <b>Відео</b] відображаються тут для конфігурації, коли ви посилаєтеся на них із електронної таблиці за допомогою тегів {1} або {2}. І навпаки, ви також можете додати їх сюди вручну, перш ніж посилатись на них із електронної таблиці.
ui.hints.projectTrack.resetStyling=Щоб зрозуміти всі варіанти дизайну, корисно просто трохи погратися з ними. Але не бійтеся щось зламати! Ви завжди можете натиснути цю кнопку, щоб повернути дизайн до останнього збереженого або завантаженого з диску.
ui.hints.projectTrack.guides=Ця кнопка показує та приховує неймовірно корисні підказки компонування. Вони не тільки допомагають вам вивчити Cinecred, але також життєво важливі для ефективної роботи, навіть якщо ви добре розумієтесь на цьому. Порада: Наведіть курсор на цю кнопку, щоб побачити значення кожного кольору підказок з компонування.
ui.hints.projectTrack.video=Якщо ви хочете переглянути свої титри в дії, натисніть цю кнопку, щоб відобразити панель попереднього перегляду відео.
ui.hints.projectTrack.delivery=Коли ви будете готові експортувати, натисніть цю кнопку, щоб відкрити панель рендерингу.
ui.hints.projectTrack.finished=Вітаємо! Тепер ви знайомі з основами Cinecred. Далі, ми рекомендуємо ознайомитися з вичерпним посібником користувача на {0}, пограти з різними налаштуваннями дизайну та глибше розглянути структуру електронної таблиці. Бажаємо вам приємного досвіду з Cinecred!
