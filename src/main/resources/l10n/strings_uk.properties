slogan=Створюйте гарні титри до фільмів без зайвих зусиль
teaser=Якщо ви колись збирали разом кінцеві титри для фільму, то ви напевно знаєте, що це вимагає багато зусиль зібрати їх до купи, та викликає великі труднощі зробити це правильно. Зміна шару, розміру шрифту або додавання пробілів, фактично, це забирає дуже багато часу. І навіть не думайте, що зможете зразу точнісінько вкластися у вимоги по тривалості коли будете ходити по колу, навколо пастки мерехтіння.\n\nАле є кращий шлях: Cinecred, безкоштовна та з відкритим кодом програма, щоб створювати титри без великих зусиль. Cinecred вичитує ваші дані по титрам з Excel, LibreOffice, Google або Nextcloud електронних таблиць, і потім дозволяє вам інтерактивно виставляти та стилізувати титри в будь-який спосіб який вам до вподоби. В наявності є стандартний шаблон який надасть вам швидкого старту, але ви самі можете налаштувати все під себе, до самого пікселю. Використовуйте свої шрифти або вставляйте лого, зображення, або навіть відео. І коли ви вже все зробили, перевірте прокручування титрів в інтегрованому плеєрі, перед тим як експортувати їх в надмірну кількість відео форматів та формати послідовності зображень.
