projectIO.credits.videoIllFormatted=Тег відео повинен мати в собі назву відео файлу (або папку з послідовністю одиничних кадрів) в проєктній папці, опціонально за ним слідує ідентифікатор, щоб налаштувати багато середовищ того самого відео окремо. Приклади: {0}
projectIO.credits.table.headDesc=Текст зверху або зліва від тіла.\n\nВикористайте {0} для зміни стилю літер на {1}, та тільки {2} скидає їх. Приклад: {3}
projectIO.credits.table.bodyDesc=Текст, зображення, або відео між наявною головою та хвостом. В залежності від стилю контенту, кожний рядок таблиці може бути новою клітинкою сітки, клітинкою руху або параграфом.\n\n{0} працює як {1}\n\n{2} щоб створити пусту клітинку\n\n{3} вставляє зображення та {4} вставляє відео або послідовність зображень з теки проєкту. Це може бути налаштовано з панелі дизайну. Ви можете пропустити розширення файлу, або додати тег, для того щоб сконфігурувати багато середовищ одного того самого файлу окремо. Приклади: {5}
projectIO.credits.table.tailDesc=Текст знизу або справа від тіла.\n\n{0} працює так само як і {1}.
projectIO.credits.table.vGapDesc=Вертикальний інтервал між попереднім та наступним блоком голова-тіло-хвіст(в одиницях вимірювання налаштованих для всього проєкту, або в пікселях під час додавання {0}).
projectIO.credits.table.contentStyleDesc=Розпочніть новий блок голова-тіло-хвіст з цим стилем. Новий стиль також буде застосовано до всіх наступних блоків.
projectIO.credits.table.breakHarmonizationDesc=Запобігає гармонізації {0}, {1}, або {2} через цю точку. Розділіть багато варіантів пробілами.
projectIO.credits.table.spinePosDesc=Для панелей: Розпочинає новий хребет на цьому горизонтальному та опціонально вертикальному зміщенні, з центру зображення в пікселях. Додані {0} або {1} позиції додають новий хребет нижче або вище від позиції, замість розміщення його по центру. Приклади: {2}\n\nДля прокручування заголовків: Розпочинає новий хребет знизу від попереднього, на цьому горизонтальному зміщенні від центру зображення в пікселях. Приклади: {3}\n\nДля обох: Ви також можете вказати горизонтальне зміщення від центру зображення з доданим {4} до позиції новим хребтом, далі після попереднього. Або використати {5}, що відображає попередження при введені. Приклади: {6}
projectIO.credits.table.pageStyleDesc=Розпочинає нову сторінку з цим стилем.
projectIO.credits.table.pageRuntimeDesc=Бажаний час виконання нової сторінки в якості таймкоду. Багато сторінок що прокручуються, можуть бути налаштовані разом, за допомогою додавання префіксу з назвою групи до таймкоду першої сторінки, та використовувати назву цієї групи як час виконання для інших сторінок. Приклад для таймкод формату SMPTE: {0}
projectIO.credits.table.pageGapDesc=Проміжок часу між сторінками як позитивний або негативний таймкод, або {0} щоб вставити панелі в заголовки які прокручуються, додатково опціональний таймкод тривалості переходу та назва стилю переходу, щоб плавно налаштувати швидкість перекручування сторінок. Приклади для SMPTE: {1}
