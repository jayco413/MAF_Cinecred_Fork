ui.hints.welcomeTrack.welcome=Bem-vindo ao Cinecred! Dicas como esta irão apresentar-lhe as noções básicas do programa.\n\nEstá atualmente na guia {0}. Em seguida, veremos a guia {1} à esquerda.
ui.hints.welcomeTrack.project=Um projeto Cinecred nada mais é do que uma pasta com pelo menos um ficheiro de planilha de créditos e um ficheiro “Styling.toml”. Além disso, ela pode conter fontes, imagens, vídeos e sequências de imagens.
ui.hints.welcomeTrack.create=Clique aqui para inicializar um novo projeto numa pasta vazia.
ui.hints.welcomeTrack.open=Clique aqui para abrir uma pasta de projeto existente.
ui.hints.welcomeTrack.drop=Alternativamente, também pode arrastar e soltar uma pasta de projeto vazia ou existente nesta janela (ou até mesmo no ícone da app) para inicializá-la ou abri-la, respectivamente.
ui.hints.projectTrack.pageTabs=Abriu uma pasta de projeto com sucesso! Vamos agora começar com o básico.\n\nNo Cinecred, os créditos são compostos por páginas. Cada página é um cartão de título ou uma secção de créditos em rolagem que pode incluir cartões de título. Use as guias acima para navegar entre as páginas.
ui.hints.projectTrack.creditsLog=Na pasta do projeto, existe um ficheiro de planilha. Abra-o agora com um programa adequado. Nesse ficheiro, fornece os dados brutos dos créditos e declara quais estilos devem ser aplicados a quais partes. Quaisquer problemas com o ficheiro serão exibidos nesta lista.
ui.hints.projectTrack.toggleStyling=Este botão mostra e oculta o painel de estilização à direita. Dica: posicione o programa com o qual edita a planilha no mesmo local. Pode depois alternar entre a planilha e o painel de estilização por meio deste botão.
ui.hints.projectTrack.stylingTree=Neste painel de estilização, edita o ficheiro “Styling” da pasta do projeto. Além de algumas configurações de projeto, aqui define estilos nomeados, que são então referenciados na planilha.\n\n<b>Estilos da Página</b> governam o comportamento das páginas; por exemplo, define a velocidade de rolagem num estilo da página. Na planilha, cada página recebe um estilo da página.\n\n<b>Estilos do Conteúdo</b> determinam a aparência dos chamados blocos cabeçalho-corpo-cauda; tal bloco pode, por exemplo, consistir no cargo “Figurantes” junto a um grupo de nomes. Na planilha, cada bloco recebe um estilo do conteúdo que então determina o seu layout e estilos da letra.\n\n<b>Estilos da Letra</b> determinam a aparência do texto. Um estilo da letra define a fonte e várias outras propriedades como cor e espaçamento entre letras. Estilos da letra são referenciados principalmente pelos estilos do conteúdo. No entanto, eles também podem ser referenciados diretamente na planilha via a tag {0} para usar diferentes estilos da letra no mesmo trecho de texto.\n\n<b>Estilos de Transição</b> especificam rampas que fazem cartões e vídeos aparecerem e desaparecerem e alteram suavemente a velocidade de rolagem entre páginas de cartão fundidas e páginas de rolagem.\n\n<b>Imagens</b> e <b>Vídeos</b> aparecem aqui para configuração quando os referencia na planilha por meio das tags {1} ou {2}. Por outro lado, também pode adicioná-los manualmente aqui antes de referenciá-los na planilha.
ui.hints.projectTrack.resetStyling=Para perceber todas as opções de estilização, é útil brincar um pouco com elas. Mas não tenha medo de quebrar algo! Sempre pode clicar neste botão para reverter a estilização para a última gravada ou carregada do disco.
ui.hints.projectTrack.guides=Este botão mostra e oculta guias de layout extremamente úteis. Elas não apenas ajudam-lo a aprender o Cinecred, mas também são vitais para trabalhar de forma eficiente mesmo quando já domina o programa. Dica: passar o cursor sobre este botão mostra o significado da cor de cada guia de layout.
ui.hints.projectTrack.video=Quando quiser ver os seus créditos em ação, clique neste botão para abrir o painel de pré-visualização de vídeo.
ui.hints.projectTrack.delivery=Quando estiver pronto para exportar, clique neste botão para abrir o painel de entrega.
ui.hints.projectTrack.finished=Parabéns! Agora está familiarizado com o básico do Cinecred. Em seguida, recomendamos consultar o guia completo do utilizador em {0}, brincar com as várias configurações de estilização e dar uma olhada mais detalhada na estrutura da planilha. Desejamos-lhe uma experiência agradável com o Cinecred!
