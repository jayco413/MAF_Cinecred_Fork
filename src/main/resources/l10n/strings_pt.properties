projectIO.credits.table.pageRuntimeDesc=Tempo de execução desejado da nova página como código de tempo. Várias páginas de rolagem podem ser ajustadas em conjunto a adicionar um nome de grupo ao código de tempo da primeira página e usando esse nome de grupo como tempo de execução das demais páginas. Exemplos para SMPTE: {0}
