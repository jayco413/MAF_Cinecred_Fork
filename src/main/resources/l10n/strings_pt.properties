projectIO.credits.table.headDesc=Texto acima ou à esquerda do corpo.\n\nUse {0} para alterar o estilo da letra para {1} e apenas {2} para redefini-lo. Exemplo: {3}
projectIO.credits.table.bodyDesc=Texto, imagens ou vídeos entre o cabeçalho e a cauda mais recentes. Dependendo do estilo do conteúdo, cada linha da tabela é uma nova célula de grade, célula de fluxo ou parágrafo.\n\n{0} funciona como em {1}.\n\nUse {2} para uma célula vazia.\n\nUse {3} para inserir uma imagem ou {4} para inserir um vídeo ou sequência de imagens da pasta do projeto. Estes podem depois ser configurados no painel de estilização. Pode omitir a extensão do ficheiro ou acrescentar um qualificador para configurar separadamente múltiplas aparições do mesmo ficheiro. Exemplos: {5}
