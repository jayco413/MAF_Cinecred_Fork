ui.styling.global.uppercaseExceptions.desc=Estes padrões são isentos quando um estilo da letra aplica letras maiúsculas. Cada linha declara um padrão. Um espaço reservado pode ou não ser posto no início e/ou final de um padrão. O espaço reservado # corresponde a qualquer letra maiúscula ou capitular. O espaço reservado _ garante que o padrão não seja imediatamente precedido ou seguido, respectivamente, por uma letra sem espaço em branco.
