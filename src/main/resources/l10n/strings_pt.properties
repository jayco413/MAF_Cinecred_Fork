projectIO.credits.table.vGapDesc=Espaçamento vertical entre os blocos cabeçalho-corpo-cauda acima e abaixo (em unidades configuradas do projeto, ou em pixels ao adicionar {0}).
projectIO.credits.table.contentStyleDesc=Inicia um novo bloco cabeçalho-corpo-cauda com este estilo. O novo estilo também é aplicado a todos os blocos seguintes.
projectIO.credits.table.breakHarmonizationDesc=Impede a harmonização do {0}, {1} ou {2} além deste ponto. Separe múltiplas opções com espaços.
projectIO.credits.table.spinePosDesc=Para cartões: Inicia uma nova espinha com este deslocamento horizontal e opcionalmente vertical do centro do ecrã em pixels. Adicionar {0} ou {1} põe a nova espinha abaixo ou acima da posição em vez de centralizá-la. Exemplos: {2}\n\nPara rolagens: Inicia uma nova espinha abaixo da anterior com este deslocamento horizontal do centro do ecrã em pixels. Exemplo: {3}\n\nPara ambos: Também pode inserir um deslocamento horizontal do centro do ecrã seguido por {4} para pôr a nova espinha ao lado da anterior. Ou use {5}, que é explicado por meio de um aviso ao digitá-lo. Exemplos: {6}
